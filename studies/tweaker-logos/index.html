<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo wisps tweaker</title><style>body{margin:0;background:#0d0e12}</style></head>
<body>
<script src="../tweaker-deck/tweaker.js"></script>
<script>
/* the client-logo wisps on the real home page (app.js reads window.__wisp; a 'tweak' event replays).
   Press Replay (R) to watch it again, Copy values to send your favourite back. */
/* Save writes these values into the site (data/tweaks.json via the dev server); the page opens on what was saved */
fetch('/__tweak').then(r => r.json()).catch(() => ({})).then(all => {
const saved = all['logo-wisps'] || {};
Tweaker({
  save: values => fetch('/__tweak', { method: 'POST', body: JSON.stringify({ name: 'logo-wisps', values }) }).then(r => { if (!r.ok) throw new Error(r.status); }),
  title: 'Logo wisps',
  url: '../../index.html#brands',
  params: [
    { key: 'step', label: 'Dot spacing', group: 'Scale', type: 'range', min: 2, max: 8, step: 1, value: 3, unit: 'px', hint: 'Smaller = more dots, finer logos' },
    { key: 'dot', label: 'Dot size', group: 'Scale', type: 'range', min: .6, max: 4, step: .1, value: 1.6, unit: 'px' },
    { key: 'scatter', label: 'How far they drift in from', group: 'Layout', type: 'range', min: 20, max: 400, step: 5, value: 170, unit: 'px' },
    { key: 'lift', label: 'Vertical spread', group: 'Layout', type: 'range', min: 0, max: 1.5, step: .05, value: .6, unit: '×', hint: 'How tall the incoming cloud is' },
    { key: 'curl', label: 'Wisp curl', group: 'Shape', type: 'range', min: 0, max: 100, step: 1, value: 36, unit: 'px', hint: 'How much each dot loops on its way in' },
    { key: 'dur', label: 'Time to settle', group: 'Motion', type: 'range', min: .3, max: 4, step: .05, value: .9, unit: 's' },
    { key: 'stagger', label: 'Logo to logo delay', group: 'Motion', type: 'range', min: 0, max: .5, step: .01, value: .05, unit: 's' },
    { key: 'spread', label: 'Dots arrive spread over', group: 'Motion', type: 'range', min: 0, max: .9, step: .01, value: .3, unit: '×', hint: '0 = every dot of a logo leaves together' }
  ].map(p => (p.key in saved ? Object.assign(p, { value: saved[p.key] }) : p))
});
});
</script>
</body></html>
