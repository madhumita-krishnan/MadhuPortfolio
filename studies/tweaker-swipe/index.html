<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swipe deck tweaker</title><style>body{margin:0;background:#0d0e12}</style></head>
<body>
<script src="../tweaker-deck/tweaker.js"></script>
<script>
/* the case-study swipe deck on the real home page (review copy). Drag the deck in the viewport to feel it;
   Save writes these into the site (data/tweaks.json via the dev server). */
fetch('/__tweak').then(r => r.json()).catch(() => ({})).then(all => {
const saved = all['swipe-deck'] || {};
Tweaker({
  save: values => fetch('/__tweak', { method: 'POST', body: JSON.stringify({ name: 'swipe-deck', values }) }).then(r => { if (!r.ok) throw new Error(r.status); }),
  title: 'Swipe deck',
  url: '../../index.html#work',
  params: [
    { key: 'cardW', label: 'Card width', group: 'Scale', type: 'range', min: 40, max: 90, step: 1, value: 68, unit: '%', cssUnit: '', css: '--sd-card-w', hint: 'Share of the screen width' },
    { key: 'cardH', label: 'Card height cap', group: 'Scale', type: 'range', min: 30, max: 80, step: 1, value: 62, unit: '%', cssUnit: '', css: '--sd-card-h', hint: 'Share of the screen height, so card + title never clip' },
    { key: 'gap', label: 'Gap between cards', group: 'Scale', type: 'range', min: 0, max: 15, step: .5, value: 6, unit: '%', cssUnit: '', css: '--sd-gap', hint: 'Share of the screen width' },
    { key: 'side', label: 'Neighbour size', group: 'Layout', type: 'range', min: .3, max: 1, step: .01, value: .65, unit: '×', css: '--sd-side' },
    { key: 'radius', label: 'Corner softness', group: 'Shape', type: 'range', min: 0, max: .25, step: .005, value: .08, unit: '×', css: '--sd-radius', hint: 'Share of the card width' },
    { key: 'settle', label: 'Settle time', group: 'Motion', type: 'range', min: .2, max: 1.4, step: .05, value: .6, unit: 's', cssUnit: '', css: '--sd-settle' },
    { key: 'bg', label: 'Background', group: 'Colour', type: 'color', value: '#101010', css: '--sd-bg' }
  ].map(p => (p.key in saved ? Object.assign(p, { value: saved[p.key] }) : p))
});
});
</script>
</body></html>
