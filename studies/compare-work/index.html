<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work list or deck</title>
<style>
:root{--bg:#0d0e12;--ink:#e9ebf1;--dim:#9aa0ad;--line:#2b2f3a}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
header b{font-weight:600}
.seg{display:flex;gap:6px}
.seg button{font:inherit;color:var(--ink);background:#1a1d25;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;padding:20px 16px}
figure{margin:0;display:flex;flex-direction:column;gap:10px;align-items:center}
figcaption{color:var(--dim)}
figcaption b{color:var(--ink);font-weight:600}
.frame{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#000}
.frame iframe{display:block;border:0;transform-origin:0 0}
</style></head>
<body>
<header><b>Work list or deck: pick one</b>
  <div class="seg" role="group" aria-label="Screen size">
    <button type="button" data-w="390" data-h="844" aria-pressed="true">Phone</button>
    <button type="button" data-w="1280" data-h="800" aria-pressed="false">Desktop</button>
  </div>
</header>
<main>
  <figure><div class="frame"><iframe title="Home page with the vertical list" data-src="../../index.html#work"></iframe></div>
    <figcaption><b>A · List</b>, phones focus one project at a time</figcaption></figure>
  <figure><div class="frame"><iframe title="Home page with the sideways deck" data-src="../../deck.html#work"></iframe></div>
    <figcaption><b>B · Deck</b>, swipe or scroll sideways</figcaption></figure>
</main>
<script>
/* both versions of the home page side by side, real pages in real sizes, scaled to fit */
const btns=[...document.querySelectorAll('.seg button')],frames=[...document.querySelectorAll('.frame')];
function size(w,h){
  const k=Math.min(1,(innerWidth-48)/(w*2+28),(innerHeight-130)/h);
  frames.forEach(f=>{const i=f.querySelector('iframe');f.style.width=w*k+'px';f.style.height=h*k+'px';
    i.style.width=w+'px';i.style.height=h+'px';i.style.transform='scale('+k+')';i.src=i.dataset.src+'';});
}
btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>x.setAttribute('aria-pressed',x===b));size(+b.dataset.w,+b.dataset.h)});
let cur=btns[0];addEventListener('resize',()=>{const b=btns.find(x=>x.getAttribute('aria-pressed')==='true');size(+b.dataset.w,+b.dataset.h)});
size(390,844);
</script>
</body></html>
