<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deck tweaker</title><style>body{margin:0;background:#0d0e12}</style></head>
<body>
<script src="tweaker.js"></script>
<script>
/* the case-study deck on deck.html, live. Press Copy values and paste the tweaker: block back to bake it in. */
/* Save writes these values into the site (data/tweaks.json via the dev server); the page opens on what was saved */
fetch('/__tweak').then(r => r.json()).catch(() => ({})).then(all => {
const saved = all['case-deck'] || {};
Tweaker({
  save: values => fetch('/__tweak', { method: 'POST', body: JSON.stringify({ name: 'case-deck', values }) }).then(r => { if (!r.ok) throw new Error(r.status); }),
  title: 'Case study deck',
  url: '../../deck.html#work',
  params: [
    { key: 'card', label: 'Card size', group: 'Scale', type: 'range', min: 280, max: 900, step: 10, value: 560, unit: 'px', css: '--deck-card', hint: 'Width and height of each square card' },
    { key: 'gap', label: 'Space between cards', group: 'Scale', type: 'range', min: 0, max: 140, step: 2, value: 36, unit: 'px', css: '--deck-gap' },
    { key: 'title', label: 'Project name size', group: 'Scale', type: 'range', min: 18, max: 72, step: 1, value: 38, unit: 'px', css: '--deck-title' },
    { key: 'stagger', label: 'Neighbour drop and rise', group: 'Layout', type: 'range', min: 0, max: 45, step: 1, value: 16, unit: '%', css: '--deck-stagger', hint: 'Right card sits this much lower, left card this much higher' },
    { key: 'side', label: 'Neighbour size', group: 'Layout', type: 'range', min: .3, max: 1, step: .01, value: .66, unit: '×', css: '--deck-side', hint: '1 = neighbours as big as the centre card' },
    { key: 'radius', label: 'Corner softness', group: 'Shape', type: 'range', min: 0, max: 90, step: 1, value: 32, unit: 'px', css: '--deck-radius' },
    { key: 'bg', label: 'Card colour', group: 'Colour', type: 'color', value: '#161a24', css: '--deck-bg' }
  ].map(p => (p.key in saved ? Object.assign(p, { value: saved[p.key] }) : p))
});
});
</script>
</body></html>
